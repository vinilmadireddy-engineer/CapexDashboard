<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capex Dashboard | Sign in</title>
  <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='vendor/bootstrap-icons/font/bootstrap-icons.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='capex.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <img class="bosch-logo" src="{{ url_for('static', filename='Bosch_symbol_logo_white_red.svg') }}" alt="Bosch">
      <p class="eyebrow">GR/FCM-Ban</p>
      <h1>Capex Budget Dashboard</h1>
      <p class="auth-intro">Sign in to review and update your Capex projects.</p>
      {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
      <form method="post" class="mt-4">
        <label class="form-label" for="username">Username</label>
        <input class="form-control form-control-lg mb-3" id="username" name="username" autocomplete="username" required autofocus>
        <label class="form-label" for="password">Password</label>
        <input class="form-control form-control-lg mb-4" id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="btn btn-primary btn-lg w-100" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Sign in</button>
      </form>
      <p class="security-note"><i class="bi bi-shield-check me-1"></i> Projects are filtered by custodian</p>
    </section>
  </main>
</body>
</html>
